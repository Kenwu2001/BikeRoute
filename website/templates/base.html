<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <style>      #location-info {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        padding: 15px;
        border-radius: 5px;
        background-color: #f8f9fa;
        border: 1px solid #dee2e6;
        white-space: pre-line;
        min-height: 120px;
      }
    </style>

    <title>{% block title %}Home{% endblock %}</title>
  </head>
  <body>
    <div class="container-fluid mt-3 text-start">      {% block content %}
      <!-- Auto-starting Location Tracking Interface -->
      <div id="tracking-interface">
        <div class="text-center mb-3">
          <h2>🔴 BikeRoute+ Live Tracking</h2>
        </div>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Current Location:</h5>
            <p id="location-info">Starting location tracking...</p>
          </div>
        </div>
      </div>
      {% endblock %}
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="{{ url_for('static', filename='index.js') }}"
    ></script>
  </body>
</html>
