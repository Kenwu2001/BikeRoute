{% extends "base.html" %}

{% block title %}即時腳踏車導航{% endblock %}
{% block h1 %}地圖導航{% endblock %}

{% block content %}
  <!-- Leaflet 專用 CSS（建議也可移至 base.html 的 head） -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
  />

  <style>
    #map { height: 80vh; width: 100%; }
    #controls { padding: 10px; }
  </style>

  <div id="controls">
    <label>目的地座標：
      <input id="dest-lat" type="number" placeholder="緯度" step="0.000001">
      <input id="dest-lng" type="number" placeholder="經度" step="0.000001">
      <button id="start-nav">開始導航</button>
    </label>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS 套件 -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <!-- 模組化 JS -->
  <script type="module">
    import { initMap, startTracking, setupNavigationButton } from "/static/map.js";
    initMap();
    startTracking();
    setupNavigationButton();
  </script>
{% endblock %}
