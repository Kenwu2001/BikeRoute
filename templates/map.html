<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouBike Routing Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 85vh;
      width: 100%;
    }
    #controls {
      padding: 10px;
      background-color: #f5f5f5;
    }
    .info.legend {
      font-family: Arial, sans-serif;
      z-index: 1000;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="address">輸入目的地地址：</label>
    <input type="text" id="address" placeholder="例如：台北車站">
    <label for="group">同行人數：</label>
    <input type="number" id="group" value="1" min="1" max="30" style="width: 60px; margin-right: 10px;">
    <button onclick="geocodeAndRoute()">規劃路線</button>
    <button id="toggleLock" class="no-reroute" onclick="toggleLock()">🔓 鎖定我</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/static/routeHint.js"></script>
  <script src="/static/position.js"></script>
  <script src="/static/stationInfo.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
