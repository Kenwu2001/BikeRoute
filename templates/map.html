<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouBike Routing Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map {
      height: 85vh;
      width: 100%;
    }
    #controls {
      padding: 10px;
      background-color: #f5f5f5;
    }
    .info.legend {
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="controls">
    <label for="address">輸入目的地地址：</label>
    <input type="text" id="address" placeholder="例如：台北車站、信義威秀、政大圖書館">
    <button onclick="geocodeAndRoute()">規劃路線</button>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/static/main.js"></script>
</body>
</html>
